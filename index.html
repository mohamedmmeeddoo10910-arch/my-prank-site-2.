
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Chaos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial,sans-serif;text-align:center}
#start{padding-top:35vh}
button{padding:16px 24px;border:0;border-radius:12px;font-size:18px;cursor:pointer}
#show{display:none;position:fixed;inset:0;overflow:hidden;background:#000}
#stop{position:fixed;top:12px;right:12px;z-index:5;padding:10px;font-size:14px}
.stripe{position:absolute;left:-30%;width:160%;height:20%;animation:move .18s steps(2) infinite}
.a{top:10%;background:linear-gradient(90deg,magenta,cyan,lime,yellow)}
.b{top:40%;background:linear-gradient(90deg,red,blue,yellow,lime);animation-direction:reverse}
.c{bottom:5%;background:linear-gradient(90deg,cyan,magenta,orange,blue)}
#orb{position:absolute;width:60vw;height:60vw;max-width:300px;max-height:300px;left:50%;top:50%;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);animation:spin .5s linear infinite;transform:translate(-50%,-50%)}
#orb:after{content:"";position:absolute;inset:30%;background:#000;border-radius:50%}
@keyframes move{from{transform:translateX(-15%) skewX(15deg)}to{transform:translateX(15%) skewX(-15deg)}}
@keyframes spin{to{rotate:360deg}}
</style>
</head>
<body>
<div id="start">
<h2>Ready?</h2>
<button onclick="start()">START</button>
</div>
<div id="show">
<div class="stripe a"></div><div class="stripe b"></div><div class="stripe c"></div><div id="orb"></div>
<button id="stop" onclick="end()">STOP</button>
</div>
<script>
function start(){
document.getElementById('start').style.display='none';
document.getElementById('show').style.display='block';
}
function end(){
document.getElementById('show').style.display='none';
document.getElementById('start').style.display='block';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')end()});
</script>
</body>
</html>
